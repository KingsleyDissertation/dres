Generators:
    Slack_generator:
        bus: THSO3-
        control: Slack
        p_nom: 1000000
        carrier: AC
        marginal_cost: 200
    gas_turbine(Oil_station):
        bus: FLTOCC1C
        control: PV
        carrier: AC
        p_nom: 10
        p_set: 10.0
        marginal_cost: 150


StorageUnits:
    Orkney Storage Park:
        bus: KIRKWA1A
        carrier: AC
        p_nom: 2  
        max_hours: 8  
        efficiency_store: 0.911
        efficiency_dispatch: 0.911
        marginal_cost: 5
    KIRKWA3A_Storage:
        bus: KIRKWA3A
        p_nom: 2.585                    # MW, Maximum charging/discharging power
        max_hours: 6.363636363636363    # (16.45/2.585=6.3636....) Energy capacity in MWh / power, approximately 2.19 hours
        efficiency_store: 0.91
        efficiency_dispatch: 0.91
        state_of_charge_initial: 0.3    # Initial SOC set to 30%
        cyclic_state_of_charge: True



Loads:
    # `p_set` should be 0 for shunt reactors; `q_set` non-zero (-ve value for inductive reactive power)
    Shunt_Reactor_86109:
        bus: BURGAR1A
        p_set: 0.0
        q_set: 8.0
    Shunt_Reactor_86144:
        bus: STRONS3B
        p_set: 0.0
        q_set: 1.6
    Shunt_Reactor_86143:
        bus: SANDAY3B
        p_set: 0.0
        q_set: 0.4


